<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070a0f">
  <meta name="description" content="TV OIO — Audius e emissoras de TV.">
  <title>TV OIO</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/audio-home.css">
  <link rel="stylesheet" href="./css/tv-channels.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="./js/config.js"></script>
  <script src="./js/app.js"></script>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="tv" width="21" height="21"></i></div>
        <div>
          <div class="brand-title">TV OIO</div>
          <div class="brand-subtitle">Audius · Emissoras</div>
        </div>
      </div>
      <div class="status-pill" id="api-status"><span class="status-dot"></span>Verificando API…</div>
    </div>
  </header>

  <main>
    <section id="audio-home" aria-label="Audius">
      <div class="section-title">
        <div>
          <h2>🎵 Audius</h2>
          <p>Música em cards, com reprodução direta no TV OIO.</p>
        </div>
      </div>

      <section class="music-row" aria-labelledby="audius-title">
        <div class="music-row-head">
          <div>
            <p class="audio-home-kicker">Audius · Música</p>
            <h2 id="audius-title">Audius</h2>
          </div>
          <div id="audius-status" class="audio-home-status loading">Conectando…</div>
        </div>

        <form id="audius-search" class="music-search" role="search">
          <input id="audius-query" type="search" autocomplete="off" placeholder="Buscar no Audius…" aria-label="Buscar no Audius">
          <button type="submit">Buscar</button>
        </form>

        <div id="audius-message" class="audio-home-message" hidden></div>
        <div id="audius-tracks" class="music-carousel" aria-live="polite">
          <div class="audio-home-loading">Carregando Audius…</div>
        </div>
      </section>

      <div class="audio-home-player" aria-label="Player de áudio">
        <div id="audio-home-art" class="audio-home-art">♫</div>
        <div class="audio-home-player-meta">
          <strong id="audio-home-title">Nada tocando</strong>
          <span id="audio-home-artist">Escolha uma faixa</span>
        </div>
        <button id="audio-home-toggle" class="audio-home-toggle" type="button" aria-label="Reproduzir">▶</button>
        <input id="audio-home-volume" type="range" min="0" max="1" step="0.05" value="0.9" aria-label="Volume">
        <audio id="audio-home-player" preload="none"></audio>
      </div>
    </section>

    <section id="tv-channels-home" aria-label="Emissoras de TV"></section>
  </main>

  <footer>TV OIO · Audius e emissoras · GitHub Pages</footer>
</div>

<div class="player-modal" id="player-modal" aria-hidden="true">
  <div class="player-backdrop" data-close-player></div>
  <div class="player-dialog" role="dialog" aria-modal="true" aria-labelledby="player-title">
    <button class="player-close" type="button" data-close-player aria-label="Fechar player">×</button>
    <div class="player-frame" id="player-frame"></div>
    <div class="player-info">
      <h2 id="player-title">Reproduzindo</h2>
      <p id="player-meta"></p>
    </div>
  </div>
</div>

<script src="./js/audio-home.js"></script>
<script src="./js/tv-channels.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    if (window.lucide) window.lucide.createIcons();
  });
</script>
</body>
</html>
