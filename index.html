<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV OIO - Central de Canais</title>
  <!-- Biblioteca de Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background-color: #0d1117; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
    
    .header { padding: 20px; background-color: #161b22; text-align: center; border-bottom: 1px solid #30363d; }
    .header h1 { font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; }

    /* Barra de Navegação de Canais */
    .nav-channels { display: flex; gap: 10px; overflow-x: auto; padding: 15px; background: #161b22; border-bottom: 1px solid #30363d; scrollbar-width: none; }
    .nav-channels::-webkit-scrollbar { display: none; }
    
    .btn-channel { 
      background: #21262d; border: 1px solid #30363d; color: #fff; 
      padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; 
      display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: 0.2s; 
    }
    .btn-channel:hover { background: #30363d; }
    .btn-channel.active { background: #238636; border-color: #2ea043; }

    /* Container Dinâmico do Canal */
    #app-container { flex: 1; padding: 20px; width: 100%; max-width: 1200px; margin: 0 auto; }

    /* Estilo Carrossel Netflix Avançado */
    .categoria-section { margin-bottom: 30px; }
    .categoria-section h3 { margin-bottom: 12px; font-size: 16px; color: #58a6ff; display: flex; align-items: center; gap: 8px; }
    
    .carrossel-horizontal {
      display: flex; gap: 16px; overflow-x: auto; padding: 8px 4px 16px 4px; scroll-behavior: smooth;
      scrollbar-width: thin; scrollbar-color: #30363d #0d1117;
    }
    .carrossel-horizontal::-webkit-scrollbar { height: 6px; }
    .carrossel-horizontal::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    .card-video {
      min-width: 230px; max-width: 230px; background: #161b22; border-radius: 10px; 
      overflow: hidden; border: 1px solid #30363d; cursor: pointer; flex-shrink: 0; 
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .card-video:hover {
      transform: translateY(-4px);
      border-color: #58a6ff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    
    .thumbnail-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
    .thumbnail-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .card-video:hover img { transform: scale(1.05); }

    .play-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; 
      align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; color: #fff;
    }
    .card-video:hover .play-overlay { opacity: 1; }

    .card-video p { 
      padding: 12px; font-size: 13px; line-height: 1.4; color: #c9d1d9; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; 
    }
    
    .loading-msg, .error-msg { color: #8b949e; font-size: 14px; padding: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <h1><i data-lucide="tv"></i> TV OIO - Central de Streaming</h1>
  </div>

  <!-- Botões dos Canais -->
  <div class="nav-channels" id="menu-canais">
    <button class="btn-channel active" onclick="carregarCanal('globo', this)"><i data-lucide="play-circle"></i> Globo</button>
    <button class="btn-channel" onclick="carregarCanal('band', this)"><i data-lucide="video"></i> Band</button>
    <button class="btn-channel" onclick="carregarCanal('cultura', this)"><i data-lucide="book-open"></i> Cultura</button>
    <button class="btn-channel" onclick="carregarCanal('tvescola', this)"><i data-lucide="graduation-cap"></i> TV Escola</button>
    <button class="btn-channel" onclick="carregarCanal('canalfuturalive', this)"><i data-lucide="globe"></i> Canal Futura</button>
  </div>

  <!-- Onde o JavaScript de cada canal vai injetar os 5 carrosséis -->
  <div id="app-container"></div>

  <script>
    // Função auxiliar global para estruturar o layout dos carrosséis em cada canal JS
    window.criarEstruturaCanal = function(tituloHeader, categorias, prefixoId) {
      return `
        <div class="canal-wrapper">
          <div class="canal-banner" style="background: linear-gradient(135deg, #21262d 0%, #0d1117 100%); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #30363d;">
            <h2 style="font-size: 22px; color: #fff; display: flex; align-items: center; gap: 10px;">
              <i data-lucide="tv" style="color: #238636;"></i> ${tituloHeader}
            </h2>
            <p style="color: #8b949e; font-size: 13px; margin-top: 5px;">Explore os carrosséis abaixo e assista instantaneamente.</p>
          </div>

          ${categorias.map((cat, idx) => `
            <div class="categoria-section">
              <h3><i data-lucide="${cat.icone}" style="color: #58a6ff;"></i> ${cat.titulo}</h3>
              <div class="carrossel-horizontal" id="carrossel-${prefixoId}-${idx}">
                <div class="loading-msg">Carregando conteúdos...</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Função global padrão para buscar os vídeos do YouTube na API
    window.carregarVideosAPI = async function(categorias, prefixoId, apiKey) {
      categorias.forEach(async (cat, idx) => {
        const secao = document.getElementById(`carrossel-${prefixoId}-${idx}`);
        if (!secao) return;

        try {
          const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=8&q=${encodeURIComponent(cat.query)}&type=video&key=${apiKey}`);
          const data = await res.json();

          if (data.items && data.items.length > 0) {
            secao.innerHTML = data.items.map(item => `
              <div class="card-video" onclick="window.open('https://www.youtube.com/watch?v=${item.id.videoId}', '_blank')">
                <div class="thumbnail-wrapper">
                  <img src="https://img.youtube.com/vi/${item.id.videoId}/mqdefault.jpg" alt="${item.snippet.title}" loading="lazy">
                  <div class="play-overlay"><i data-lucide="play"></i></div>
                </div>
                <p title="${item.snippet.title}">${item.snippet.title}</p>
              </div>
            `).join('');
            lucide.createIcons();
          } else {
            secao.innerHTML = `<p class="error-msg">Nenhum vídeo disponível no momento.</p>`;
          }
        } catch (e) {
          secao.innerHTML = `<p class="error-msg">Erro ao carregar stream.</p>`;
        }
      });
    }
  </script>

  <script type="module">
    import { carregarGlobo } from './js/globo.js';
    import { carregarBand } from './js/band.js';
    import { carregarCultura } from './js/cultura.js';
    import { carregarTvEscola } from './js/tvescola.js';
    import { carregarFutura } from './js/canalfuturalive.js';

    window.carregarCanal = function(nomeCanal, btnElement) {
      document.querySelectorAll('.btn-channel').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      const container = document.getElementById('app-container');
      container.innerHTML = "";

      if (nomeCanal === 'globo') carregarGlobo(container);
      if (nomeCanal === 'band') carregarBand(container);
      if (nomeCanal === 'cultura') carregarCultura(container);
      if (nomeCanal === 'tvescola') carregarTvEscola(container);
      if (nomeCanal === 'canalfuturalive') carregarFutura(container);

      // Atualiza os ícones do Lucide na tela
      lucide.createIcons();
    }

    // Carrega a Globo por padrão ao abrir
    window.onload = () => {
      lucide.createIcons();
      carregarGlobo(document.getElementById('app-container'));
      lucide.createIcons();
    };
  </script>
</body>
</html>
