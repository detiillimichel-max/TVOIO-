<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OIO TV • Teste de APIs</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui,-apple-system,Segoe UI,sans-serif; background:#0d1117; color:#fff; }
    .wrap { max-width: 1100px; margin:0 auto; padding:20px; }
    header { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:18px; }
    h1 { margin:0; font-size:22px; }
    .controls { display:flex; gap:8px; flex-wrap:wrap; }
    input,button { border:1px solid #30363d; background:#161b22; color:#fff; border-radius:10px; padding:11px 12px; }
    input { min-width:240px; }
    button { cursor:pointer; }
    button.primary { background:#238636; border-color:#2ea043; font-weight:700; }
    #status { margin:14px 0; color:#8b949e; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
    .card { overflow:hidden; background:#161b22; border:1px solid #30363d; border-radius:12px; }
    .thumb { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#000; }
    .body { padding:12px; }
    .title { margin:0 0 8px; font-size:14px; line-height:1.35; }
    .meta { color:#8b949e; font-size:12px; }
    a { color:inherit; text-decoration:none; }
    .empty { padding:24px; color:#8b949e; border:1px dashed #30363d; border-radius:12px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>OIO TV — teste real do Worker</h1>
        <div id="status">Carregando…</div>
      </div>
      <div class="controls">
        <input id="q" value="documentários Brasil" aria-label="Busca">
        <button class="primary" id="test">Buscar vídeos</button>
        <button id="health">Testar Worker</button>
      </div>
    </header>
    <section id="results" class="grid"></section>
  </main>
  <script src="./js/config.js"></script>
  <script>
    const base = (window.TVOIO_CONFIG?.apiBaseUrl || '').replace(/\/$/, '');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    const q = document.getElementById('q');
    const setStatus = (text) => status.textContent = text;

    async function health() {
      if (!base) throw new Error('Worker não configurado');
      const r = await fetch(base + '/health');
      const data = await r.json();
      if (!r.ok) throw new Error(data?.error || ('HTTP ' + r.status));
      return data;
    }

    async function searchYouTube() {
      results.innerHTML = '<div class="empty">Consultando YouTube pelo Worker…</div>';
      setStatus('Testando YouTube…');
      try {
        const query = encodeURIComponent(q.value.trim() || 'documentários Brasil');
        const r = await fetch(`${base}/youtube/search?q=${query}&maxResults=12`, { headers:{Accept:'application/json'} });
        const data = await r.json();
        if (!r.ok) throw new Error(data?.error || `HTTP ${r.status}`);
        const items = Array.isArray(data.items) ? data.items : [];
        if (!items.length) {
          results.innerHTML = '<div class="empty">A API respondeu, mas não retornou vídeos.</div>';
        } else {
          results.innerHTML = items.map(item => {
            const id = item?.id?.videoId;
            const title = item?.snippet?.title || 'Vídeo sem título';
            const channel = item?.snippet?.channelTitle || '';
            const thumb = item?.snippet?.thumbnails?.medium?.url || (id ? `https://img.youtube.com/vi/${id}/mqdefault.jpg` : '');
            return id ? `<article class="card"><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener noreferrer"><img class="thumb" src="${thumb}" alt=""><div class="body"><h2 class="title">${escapeHtml(title)}</h2><div class="meta">${escapeHtml(channel)}</div></div></a></article>` : '';
          }).join('');
        }
        setStatus(`YouTube respondeu com HTTP ${r.status}.`);
      } catch (e) {
        results.innerHTML = `<div class="empty">Falha: ${escapeHtml(e.message)}</div>`;
        setStatus('Teste concluído com erro.');
      }
    }

    async function testHealth() {
      setStatus('Consultando /health…');
      try {
        const data = await health();
        const p = data.providers || {};
        results.innerHTML = `<div class="empty">Worker online. Secrets detectados: ${Object.entries(p).filter(([,v]) => v).map(([k]) => k).join(', ') || 'nenhum'}.</div>`;
        setStatus('Worker respondeu corretamente.');
      } catch (e) {
        results.innerHTML = `<div class="empty">Falha no Worker: ${escapeHtml(e.message)}</div>`;
        setStatus('Não foi possível consultar o Worker.');
      }
    }

    function escapeHtml(s) { return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

    document.getElementById('test').addEventListener('click', searchYouTube);
    document.getElementById('health').addEventListener('click', testHealth);
    if (!base) setStatus('Worker não configurado.');
  </script>
</body>
</html>
