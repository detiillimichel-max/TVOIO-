<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OIO TV — Teste das APIs</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0f14;color:#f5f7fa;font-family:system-ui,-apple-system,sans-serif;padding:18px}main{max-width:760px;margin:auto}h1{font-size:24px;margin:0 0 6px}p{color:#aab2bf}.bar{background:#171b22;border:1px solid #2a313c;border-radius:14px;padding:14px;margin:16px 0}input{width:100%;padding:12px;border-radius:10px;border:1px solid #39424f;background:#0e1117;color:#fff;font-size:14px}button{border:0;border-radius:10px;padding:12px 16px;background:#1677ff;color:#fff;font-weight:700;margin-top:10px;width:100%}.grid{display:grid;gap:10px}.card{background:#151922;border:1px solid #2a313c;border-radius:12px;padding:13px}.name{font-weight:800}.status{font-size:13px;margin-top:6px}.ok{border-left:4px solid #22c55e}.bad{border-left:4px solid #ef4444}.warn{border-left:4px solid #f59e0b}.muted{color:#8e98a6}.small{font-size:12px;word-break:break-word}code{color:#8ec5ff}.summary{font-weight:800;margin-bottom:8px}
</style>
</head>
<body><main>
<h1>OIO TV — Laboratório de APIs</h1>
<p>Teste isolado. Não altera o aplicativo principal nem expõe nenhuma chave.</p>
<div class="bar">
<label>URL do Cloudflare Worker</label>
<input id="worker" value="https://oio-tv-api.detiillimichel.workers.dev">
<button id="run">Testar APIs agora</button>
</div>
<div id="summary" class="bar">Aguardando teste.</div>
<div id="results" class="grid"></div>
<script>
const tests=[
 ['YouTube','/youtube/search?q=teste','GET'],
 ['TMDB','/tmdb/search?q=teste','GET'],
 ['Pexels','/pexels/search?q=natureza','GET'],
 ['Pixabay','/pixabay/search?q=natureza','GET'],
 ['GNews','/gnews/search?q=brasil','GET'],
 ['Guardian','/guardian/search?q=technology','GET'],
 ['NASA','/nasa/search?q=space','GET'],
 ['Europeana','/europeana/search?q=history','GET'],
 ['DPLA','/dpla/search?q=history','GET'],
 ['Open Library','/openlibrary/search?q=dom+quixote','GET'],
 ['Open-Meteo','/openmeteo/weather?latitude=-23.55&longitude=-46.63','GET'],
 ['Spotify','/spotify/search?q=legiao+urbana&type=track','GET'],
 ['Vimeo','/vimeo/search?q=nature','GET']
];
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]));
function card(name,cls,status,detail){return `<div class="card ${cls}"><div class="name">${esc(name)}</div><div class="status">${esc(status)}</div><div class="small muted">${esc(detail)}</div></div>`}
async function testOne(base,[name,path]){
 const t=performance.now();
 try{const r=await fetch(base.replace(/\\/$/,'')+path,{cache:'no-store'});const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=null};const ms=Math.round(performance.now()-t);const ok=r.ok;let detail=data?.error||data?.message||(data?.results?'Resultados recebidos':data?.photos?'Fotos recebidas':data?.items?'Itens recebidos':data?.tracks?'Faixas recebidas':data?.data?'Dados recebidos':text.slice(0,180));return {html:card(name,ok?'ok':'bad',ok?'✓ API respondeu':'✕ API respondeu com erro',`HTTP ${r.status} • ${ms} ms • ${detail}`),ok}}
 catch(e){return {html:card(name,'bad','✕ Falha de conexão',e.message),ok:false}}
}
async function run(){const base=document.getElementById('worker').value.trim();const out=document.getElementById('results');const sum=document.getElementById('summary');out.innerHTML='';sum.textContent='Testando /health...';
 let health;
 try{const r=await fetch(base.replace(/\\/$/,'')+'/health',{cache:'no-store'});const d=await r.json();health=d;sum.innerHTML=`<div class="summary">Health: ${r.ok?'✓ respondeu':'✕ erro'} • HTTP ${r.status}</div><div class="small">Secrets detectados pelo Worker: ${esc(Object.entries(d.providers||{}).filter(([,v])=>v).map(([k])=>k).join(', ')||'nenhum')}</div>`}catch(e){sum.innerHTML=`<div class="summary">✕ Não consegui alcançar o Worker</div><div class="small">${esc(e.message)}</div>`;return}
 const results=await Promise.all(tests.map(x=>testOne(base,x)));out.innerHTML=results.map(x=>x.html).join('');const good=results.filter(x=>x.ok).length;sum.innerHTML+=`<div class="small" style="margin-top:8px">Testes reais: <b>${good}/${results.length}</b> responderam com HTTP 2xx.</div>`;
}
document.getElementById('run').onclick=run;
</script></main></body></html>
