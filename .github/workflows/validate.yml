name: Validate TV OIO

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/tv-channels.js
          node --check scripts/update-tv-lives.mjs
          node --check js/config.js
          node --input-type=module --check < js/globo.js
          node --input-type=module --check < js/band.js
          node --input-type=module --check < js/cultura.js
          node --input-type=module --check < js/tvescola.js
          node --input-type=module --check < js/canalfuturalive.js
          node --check worker.js

      - name: Verify frontend has no obvious secret files
        run: |
          test ! -f .env
          test ! -f .dev.vars
